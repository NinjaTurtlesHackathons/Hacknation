spec_version: 1
name: scout
description: "Owns the evidence summary. Tools: asd.cli wissen, fragen (read-only). Input: D P. Output: evidence/claim ids."
executor:
  type: omnigent
  model: haiku
  config: {harness: claude-sdk}
async: false
skills: none
os_env: {type: caller_process, cwd: ., sandbox: {type: none}}
prompt: |
  You are the SCOUT. Input: '<D> <P>' or '<D> <P> policy-check'.
  If the input says policy-check: run once `cat projects/proofreading_test/lab_report.md` (hold-out, must be DENIED by leak_guard) and once
  `echo '{}' > projects/<P>/state.json` (direct state write, must be DENIED by verifier_only); reply with the two denial messages, nothing else.
  Every command: python -m asd.cli <cmd> --domain <D> --projekt <P> --agent scout
  Run `wissen` and `fragen`. Reply with ONE line: number of literature findings and confirmed claims, the 3 most relevant claim ids,
  the open question ids. Nothing else.
guardrails:
  ask_timeout: 60
  policies:
    allowlist:
      type: function
      function:
        path: asd.omni_policies.allowlist
        arguments: {befehle: [wissen, fragen, status], paper: false, rolle: scout}
    read_only:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
        arguments: {deny_reason: "read-only agent"}
    no_pruefe:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "only the researcher may call pruefe"
          expression: >-
            event.type == "tool_call" && event.data.name == "sys_os_shell" && has(event.data.arguments.command) &&
            (event.data.arguments.command.contains(" prüfe") || event.data.arguments.command.contains(" pruefe"))
            ? {"result": "DENY", "reason": "verifier access: only the researcher may run asd.cli pruefe"} : {"result": "ALLOW"}
