[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "probatum"
version = "0.1.0"
description = "Verifier-gated research lab as an MCP server: your Claude proposes, a code verifier is the only authority that accepts claims."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Colin Ji" }, { name = "Laurenz Thümmler" }, { name = "Noah Schittenhelm" }, { name = "Ali Suleman" }]
# Minimal und getestet (mcp 1.28.1, numpy 2.4.6, scipy 1.17.1, sympy 1.14.0, mpmath 1.3.0, python-flint 0.9.0, networkx 3.x):
dependencies = [
  "mcp>=1.28,<2",
  "numpy>=1.26",
  "scipy>=1.11",       # lattice (FFT, Optimierung), proofreading (Optimierung)
  "sympy>=1.12",       # proofreading: symbolische Schranken
  "mpmath>=1.3",
  "python-flint>=0.6", # proofreading: rigorose Intervalle (arb)
  "networkx>=3.0",     # proofreading: Spannbäume (Matrix-Tree)
]

[project.optional-dependencies]
lab = ["matplotlib>=3.8", "pypandoc>=1.13", "requests>=2.31", "scikit-learn>=1.4", "pandas>=2.1"]   # volle Labor-Pipeline (Paper, Recherche)
test = ["pytest>=8"]

[project.scripts]
probatum-mcp = "asd.mcp_server:main"

[tool.setuptools.packages.find]
include = ["asd", "asd.*"]
