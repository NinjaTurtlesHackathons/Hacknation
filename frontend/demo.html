<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Run Demo · Probatum</title>
<meta name="description" content="40-second cinematic replay of a real logged Omnigent run: every event, time and verdict comes from runs/omnigent/2026-10-04b.">
<link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
<style>
:root{--bg:#0E1217;--panel:#151A21;--line:#262D37;--ink:#E7EAEE;--mute:#8E97A4;--proof:#93ABF2;--accent:#3E64D8;--ok:#5FC28F;--no:#E5716C;--pol:#DCA74E;
  --sans:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
body.rec{cursor:none}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#frame{width:1920px;height:1080px;position:relative;transform-origin:0 0;overflow:hidden;background:
  radial-gradient(1200px 700px at 30% 45%,#141a24 0%,var(--bg) 70%)}
#grid{position:absolute;inset:-200px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;opacity:.28;animation:drift 60s linear infinite}
@keyframes drift{to{transform:translate(64px,64px)}}
#cam{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.65,0,.25,1);transform-origin:50% 50%}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{translate:-2px 0}20%,80%{translate:5px 0}30%,50%,70%{translate:-9px 0}40%,60%{translate:9px 0}}
/* header */
#hdr{position:absolute;left:72px;top:56px;right:72px;display:flex;align-items:baseline;gap:24px;z-index:5}
#hdr .brand{font-weight:600;font-size:26px}#hdr .brand b{color:var(--proof)}
#hdr .run{color:var(--mute);font-size:20px}
#clock{margin-left:auto;font-family:var(--mono);font-size:24px;color:var(--ink);letter-spacing:.02em}
#clock small{color:var(--mute);font-size:16px;margin-left:8px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:16px;color:var(--no);font-weight:600}
.live i{width:10px;height:10px;border-radius:50%;background:var(--no);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
/* question */
#q{position:absolute;left:72px;top:118px;width:1100px;font-size:30px;line-height:1.35;font-weight:500;min-height:84px;z-index:5}
#q .lab{display:block;color:var(--mute);font-size:17px;font-weight:500;margin-bottom:6px}
#q .caret{display:inline-block;width:3px;height:30px;background:var(--proof);vertical-align:-5px;animation:blink 1s infinite}
/* agents */
#agents{position:absolute;left:0;top:0;width:1150px;height:1080px}
svg#wires{position:absolute;inset:0;width:1150px;height:1080px;overflow:visible}
.wire{stroke:var(--proof);stroke-width:2.5;fill:none;stroke-linecap:round;opacity:.9}
.wire.dim{opacity:.18}
.pulse{fill:var(--proof)}
.node{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;display:grid;place-items:center;text-align:center;
  background:var(--panel);border:2px solid var(--line);transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s,opacity .5s;opacity:.35}
.node .nm{font-weight:600;font-size:22px}.node .rl{font-size:14px;color:var(--mute);margin-top:2px}
.node.on{opacity:1;border-color:var(--proof)}
.node.hot{transform:scale(1.14);box-shadow:0 0 0 10px rgba(147,171,242,.12),0 0 0 22px rgba(147,171,242,.06)}
.node.deny{border-color:var(--pol);box-shadow:0 0 0 10px rgba(220,167,78,.16)}
.node.lead{width:190px;height:190px;margin:-95px 0 0 -95px;opacity:1;border-color:var(--accent)}
.node .badge{position:absolute;top:-14px;right:-6px;background:var(--pol);color:#1b1305;font-size:13px;font-weight:700;padding:4px 9px;border-radius:6px;opacity:0;transform:translateY(6px);transition:.25s}
.node.deny .badge{opacity:1;transform:none}
/* lanes */
#lanes{position:absolute;left:150px;top:840px;width:900px;display:grid;gap:14px;z-index:4}
.lane{display:grid;grid-template-columns:150px 1fr 230px;align-items:center;gap:16px;opacity:0;transform:translateY(12px);transition:.5s}
.lane.on{opacity:1;transform:none}
.lane .ln{font-size:18px;font-weight:600}.lane .ln small{display:block;color:var(--mute);font-weight:400;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--proof);transition:width 2.6s cubic-bezier(.3,.6,.2,1)}
.lane .ex{font-family:var(--mono);font-size:15px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* claims */
#claims{position:absolute;left:1210px;top:210px;width:640px;display:grid;gap:18px;z-index:4}
#claims h3{margin:0 0 4px;font-size:18px;color:var(--mute);font-weight:500}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:18px 22px 18px 22px;
  opacity:0;transform:translateX(60px);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1),border-color .3s;overflow:hidden}
.card.in{opacity:1;transform:none}
.card .ct{font-size:21px;line-height:1.35;font-weight:500}
.card .cr{font-size:15px;color:var(--mute);margin-top:8px;line-height:1.4}
.card .cid{font-family:var(--mono);font-size:14px;color:var(--mute);margin-bottom:6px}
.card.ok{border-left-color:var(--ok)}.card.no{border-left-color:var(--no)}
.card .slash{position:absolute;left:-5%;top:50%;width:0;height:4px;background:var(--no);transform:rotate(-8deg);transition:width .35s cubic-bezier(.7,0,.3,1)}
.card.no .slash{width:110%}
.card.no .ct{color:#b9bfc8}
.stamp{position:absolute;right:20px;top:14px;font-size:64px;line-height:1;color:var(--proof);opacity:0;transform:scale(2.6) rotate(-12deg)}
.card.ok .stamp{animation:stamp .42s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(0)}}
.xmark{position:absolute;right:24px;top:16px;font-size:44px;font-weight:700;color:var(--no);opacity:0;transition:.25s .25s}
.card.no .xmark{opacity:1}
.verdict{display:inline-block;margin-top:10px;font-size:15px;font-weight:700;padding:5px 10px;border-radius:5px}
.card.ok .verdict{background:rgba(95,194,143,.14);color:var(--ok)}.card.no .verdict{background:rgba(229,113,108,.14);color:var(--no)}
.shield{position:absolute;right:96px;top:20px;font-size:15px;font-weight:700;color:var(--pol);opacity:0;transform:translateX(30px);transition:.4s}
.card.rt .shield{opacity:1;transform:none}
/* banner */
#banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);padding:26px 40px;border-radius:10px;font-size:40px;font-weight:600;
  background:rgba(14,18,23,.92);border:2px solid var(--pol);color:var(--ink);opacity:0;transition:.35s;z-index:20;text-align:center;max-width:1300px}
#banner small{display:block;font-size:20px;font-weight:500;color:var(--mute);margin-top:10px}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner.blue{border-color:var(--accent)}
/* ticker */
#ticker{position:absolute;left:1210px;bottom:96px;width:640px;font-size:15px;color:var(--mute);display:grid;gap:6px;z-index:4}
#ticker div{display:grid;grid-template-columns:86px 110px 1fr;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:tin .3s}
#ticker time{font-family:var(--mono);color:var(--ink)}#ticker b{color:var(--ink);font-weight:600}
#ticker .k-ok b{color:var(--ok)}#ticker .k-no b{color:var(--no)}#ticker .k-deny b,#ticker .k-policy b{color:var(--pol)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* chain */
#chain{position:absolute;left:72px;right:72px;bottom:44px;display:flex;gap:4px;align-items:center;z-index:6;opacity:0;transition:.4s}
#chain.on{opacity:1}
#chain i{flex:1;height:18px;border-radius:3px;background:var(--line);transition:background .15s}
#chain i.lit{background:var(--proof)}
#chainlab{position:absolute;left:72px;bottom:72px;font-family:var(--mono);font-size:17px;color:var(--mute);opacity:0;transition:.4s;z-index:6}
#chainlab.on{opacity:1}
/* progress */
#prog{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0;z-index:30}
/* end card */
#end{position:absolute;inset:0;background:rgba(14,18,23,.94);display:grid;place-content:center;text-align:center;opacity:0;transition:opacity .8s;z-index:40;gap:26px}
#end.on{opacity:1}
#end .big{font-size:120px;color:var(--proof);line-height:1}
#end .stats{display:flex;gap:56px;justify-content:center;font-size:24px;color:var(--mute)}
#end .stats b{display:block;font-size:64px;color:var(--ink);font-weight:600}
#end .stats .ok b{color:var(--ok)}#end .stats .no b{color:var(--no)}#end .stats .pol b{color:var(--pol)}
#end .src{font-family:var(--mono);font-size:17px;color:var(--mute)}
#play{position:fixed;right:24px;bottom:24px;z-index:50;font:600 16px var(--sans);background:var(--accent);color:#fff;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
body.rec #play{display:none}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <div id="grid"></div>
  <div id="cam">
    <div id="hdr"><span class="brand"><b>∎</b> Probatum</span><span class="run" id="runlab"></span><span class="live"><i></i>Replay of a real run</span><span id="clock"></span></div>
    <div id="q"></div>
    <div id="agents"><svg id="wires"></svg></div>
    <div id="lanes"></div>
    <div id="claims"><h3>Claims and verdicts</h3></div>
    <div id="ticker"></div>
  </div>
  <div id="banner"></div>
  <div id="chainlab"></div>
  <div id="chain"></div>
  <div id="end"></div>
  <div id="prog"></div>
</div></div>
<button id="play" type="button">Replay</button>
<script src="assets/demo.js"></script>
</body>
</html>
