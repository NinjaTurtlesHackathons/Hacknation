<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run replay · Probatum Lab</title>
<meta name="description" content="Replay of a logged Omnigent run: rounds, agent events, verifier verdicts and certificates you can re-verify.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="assets/vendor/katex/katex.min.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' fill='%2323408E'/%3E%3C/svg%3E">
</head>
<body>
<a class="skip" href="#stream">Skip to the event stream</a>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="main">
    <div class="run-head">
      <h1 id="title">Run</h1>
      <p class="serif measure" id="task"></p>
      <p class="small muted" id="meta"></p>
    </div>

    <div class="controls" role="group" aria-label="Playback">
      <button class="primary" id="play" type="button">Replay run</button>
      <label class="row small muted" for="speed">Speed
        <select id="speed"><option value="0.5">Slow</option><option value="1" selected>Normal</option><option value="3">Fast</option></select>
      </label>
      <div class="progress">
        <label class="sr-only" for="scrub">Position in the run</label>
        <input type="range" id="scrub" min="0" max="0" value="0">
        <span class="small muted" id="pos" aria-live="off"></span>
      </div>
      <button id="end" type="button">Show all events</button>
    </div>

    <div class="pipeline">
      <section class="col" aria-labelledby="r-title" style="margin-top:0">
        <h2 id="r-title">Rounds</h2>
        <ol class="rounds" id="rounds"></ol>
      </section>

      <section class="col stream" aria-labelledby="s-title" style="margin-top:0" id="stream">
        <h2 id="s-title">Event stream</h2>
        <div class="lane-head" id="lane-head"></div>
        <div class="stream-scroll" id="scroll" tabindex="0" aria-label="Event stream, newest at the bottom">
          <ol class="events" id="events"></ol>
        </div>
      </section>

      <section class="col evidence" aria-labelledby="e-title" style="margin-top:0" id="evidence">
        <h2 id="e-title">Evidence and claims</h2>
        <ul class="register" id="register" aria-label="Claim register"></ul>
        <div id="claim"></div>
        <div class="cert" id="chain"></div>
      </section>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<script defer src="assets/vendor/katex/katex.min.js"></script>
<script defer src="assets/vendor/katex/contrib/auto-render.min.js" onload="document.dispatchEvent(new Event('katex-ready'))"></script>
<script src="assets/app.js"></script>
<script src="assets/run.js"></script>
</body>
</html>
